# agent-box global settings. Sourced by delegate.sh; per-project keys stay in projects/*.env.
# Workflow and evidence: research/workflow.md. Model knobs: research/opencode-customization.md.

# Engine. Podman: ~0.75 GB less RAM on the Windows side once Docker Desktop is closed, but the Lykos
# suite ran 653 s vs Docker's 504 s (one run each, 2026-10-12). An env var overrides this line.
AGENT_BOX_ENGINE="${AGENT_BOX_ENGINE:-podman}"

# Roles: "<OmniRoute model id> [reasoning effort]". Effort is sent as reasoning_effort; OmniRoute drops
# it for antigravity/claude-* and cursor ids carry the effort in the id, so those roles carry none.
# For Antigravity Gemini, high, xhigh and max all map to the same 32768-token thinking budget
# (research/opencode-customization.md §5), so high is the top tier.
#
# Budget (user, 2026-10-12/13). Quota pools: Opus and Sonnet share one, all Gemini models share one;
# DeepSeek and Kimi each have their own. Gemini has the largest quota: it does the bulk, at high effort.
# DeepSeek is cheap: retries, the quick lane, the spec review. Opus (~$30-40 per 5 hours): standards
# review, escalation, prose that ships. Kimi K3's $20 ends 2026-10-24: advice and disputed findings.
# Unused: Sonnet (spends Opus's pool), Composer (misreported tool results, research/findings.md §6),
# Codex/GPT (single-pass only through this router). One worker per task: no fan-out by default.
ROLE_implement="gemini-3.8-flash-tiered high"                # every coding task starts here
ROLE_implement_hard="deepseek/deepseek-flash-max"            # retry after a gate failure: a different family than the first try
ROLE_quick="deepseek/deepseek-flash-max"                     # trivial edits whose place is known (bench: 6-8 steps, 32-51 s)
ROLE_escalate="antigravity/claude-opus-4-6-thinking"         # after two failed rounds, with the failure history
ROLE_last_resort="antigravity/claude-opus-4-6-thinking"      # alias of escalate, kept for old commands
ROLE_write="antigravity/claude-opus-4-6-thinking"            # prose that ships: docs, ADR drafts, README
ROLE_draft="gemini-3.8-flash-tiered high"                    # prose drafts, issue text, summaries
ROLE_explore="gemini-3.8-flash-tiered high"                  # read-only research digest (delegate.sh explore)
ROLE_bughunt="gemini-3.8-flash-tiered high"                  # `hunt`: reproduces a reported bug, locates it, commits a failing test
ROLE_tests="gemini-3.8-flash-tiered high"                    # ticket mode: writes the failing tests first. No Gemini Pro: 3.1 Pro left upstream (2026-10-13)

# Review: two axes, in `delegate.sh review` and in ticket mode alike, both given the spec.
ROLE_review_spec="deepseek/deepseek-flash-max"               # does it do what the spec asks: requirements, edge cases, tests
ROLE_review_std="antigravity/claude-opus-4-6-thinking"       # the repo's documented standards, design, smells
ROLE_review_spec_alt="antigravity/claude-opus-4-6-thinking"  # the spec review when DeepSeek wrote the code: never the implementer's family
ROLE_adjudicate="cursor/kimi-k3-high"                        # read-only: settles a disputed finding; Opus after 2026-10-24
TICKET_ESCALATE_ROLE="escalate"                               # after TICKET_ESCALATE_AFTER failed rounds
TICKET_ESCALATE_AFTER=2

# The review and fix loop (delegate.sh loop, lib/loop.mjs). One fix round left Lykos T194 and T174b
# open; the Sonnet pipeline needed 3 and 6 review rounds (research/findings.md §11).
LOOP_MAX_ROUNDS=6                                             # reviews in all, then the orchestrator decides
LOOP_STUCK=2                                                  # a reproduction still failing after this many fixes by one worker: next rung
LOOP_SOFT_ROUNDS=3                                            # serious items after this many fix rounds by one worker: next rung
LOOP_LADDER="implement implement-hard escalate"               # who takes over, bottom to top
LOOP_NEIGHBOURS=30                                            # existing tests next to the change rerun each round, at most

# Single-pass advisors for the orchestrator (`delegate.sh ask`), never coding workers.
ROLE_advise="cursor/kimi-k3-high"                            # until 2026-10-24: every plan and contested call
ROLE_advise_alt="antigravity/claude-opus-4-6-thinking"       # the advisor after 2026-10-24

# Roles that never keep edits (REVIEW mode).
READ_ONLY_ROLES="review-spec review-spec-alt review-std adjudicate explore"

# Default reviewers for `delegate.sh review`.
REVIEW_ROLES="review-spec,review-std"
# Step cap per review run. Ledger, 2026-10-13: 15 reviews with a CONFIRMED finding took 6-139 steps,
# median 23, 90th percentile 85; only the 139-step one (1 CONFIRMED, 1051 s) is over this.
REVIEW_STEPS=90

# Cheap read-only subagent every worker may hand searches to. Gemini: large quota, fast.
SCOUT_MODEL="gemini-3.8-flash-tiered"
