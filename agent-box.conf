# agent-box global settings. Sourced by delegate.sh; per-project keys stay in projects/*.env.
# Workflow and evidence: research/workflow.md. Model knobs: research/opencode-customization.md.

# Engine. Podman: ~0.75 GB less RAM on the Windows side once Docker Desktop is closed, but the Lykos
# suite ran 653 s vs Docker's 504 s (one run each, 2026-10-12). An env var overrides this line.
AGENT_BOX_ENGINE="${AGENT_BOX_ENGINE:-podman}"

# Roles: "<OmniRoute model id> [reasoning effort]". Effort is sent as reasoning_effort; OmniRoute drops
# it for antigravity/claude-* and cursor ids carry the effort in the id, so those roles carry none.
#
# Budget (2026-10-12): Gemini (Antigravity) quota is large and resets; DeepSeek is a pay-per-token API
# with little balance left, so it gets the jobs where its precision pays (review, third attempt);
# Sonnet/Opus quota is limited: never a first attempt, never in a fan-out.
# Excluded from coding: Codex/GPT models (single-pass only through this router).
ROLE_implement="gemini-3.8-flash-tiered medium"              # main worker
ROLE_implement_hard="gemini-3.8-flash-tiered high"           # cross-module work, or retry after a gate failure
ROLE_implement_alt="cu/composer-2.5-fast"                    # second family (Cursor): fan-out partner
ROLE_implement_alt2="deepseek/deepseek-flash"                # third family, hard bugs only (paid per token)
ROLE_grok="cursor/cursor-grok-4.6-high"                      # NOT AVAILABLE 2026-10-12: Cursor upstream not_found
ROLE_escalate="antigravity/claude-sonnet-4-6"                # after two cheap gate failures, or judged hard up front
ROLE_last_resort="antigravity/claude-opus-4-6-thinking"      # one attempt with the full failure history
ROLE_write="antigravity/claude-sonnet-4-6"                   # prose that ships: docs, ADR drafts, README
ROLE_draft="gemini-3.8-flash-tiered medium"                  # cheap prose drafts, issue text, summaries
ROLE_review="deepseek/deepseek-flash"                        # precise reviewer, different family from the main worker
ROLE_review_alt="cu/composer-2.5-fast"                       # second reviewer family
ROLE_review_gemini="gemini-3.8-flash-tiered medium"          # reviewer when the change came from a non-Gemini worker
ROLE_deep_review="antigravity/gemini-3.1-pro-high"           # slow, thorough: large or risky diffs
ROLE_bughunt="antigravity/gemini-3.1-pro-high"               # read-only bug hunt in a module
ROLE_adjudicate="antigravity/claude-opus-4-6-thinking"       # read-only: settles a disputed high-severity finding

# Single-pass advisors for the orchestrator (`delegate.sh ask`), never coding workers.
ROLE_advise="cu/gpt-5.6-sol-high"                            # NOT AVAILABLE 2026-10-12: Cursor not_found, Codex token invalid
ROLE_advise_alt="antigravity/claude-opus-4-6-thinking"       # second opinion when Sol is unavailable (quota!)

# Roles that never keep edits (REVIEW mode).
READ_ONLY_ROLES="review review-alt review-gemini deep-review bughunt adjudicate"

# Default reviewers for `delegate.sh review`: two families, neither of them the main worker's.
REVIEW_ROLES="review,review-alt"

# Cheap read-only subagent every worker may hand searches to. Gemini: large quota, fast.
SCOUT_MODEL="gemini-3.8-flash-tiered"
