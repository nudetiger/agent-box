# agent-box global settings. Sourced by delegate.sh; per-project keys stay in projects/*.env.
# Workflow and evidence: research/workflow.md. Model knobs: research/opencode-customization.md.

# Engine. Podman: ~0.75 GB less RAM on the Windows side once Docker Desktop is closed, but the Lykos
# suite ran 653 s vs Docker's 504 s (one run each, 2026-10-12). An env var overrides this line.
AGENT_BOX_ENGINE="${AGENT_BOX_ENGINE:-podman}"

# Roles: "<OmniRoute model id> [reasoning effort]". Effort is sent as reasoning_effort; OmniRoute drops
# it for antigravity/claude-* and cursor ids carry the effort in the id, so those roles carry none.
# For Antigravity Gemini, high, xhigh and max all map to the same 32768-token thinking budget
# (research/opencode-customization.md §5), so high is the top tier.
#
# Budget (user, 2026-10-12): Gemini quota is the largest: it does the bulk, at high effort. DeepSeek is
# cheap: use it where it is strong (bench 4/5, fastest), without overusing it. Opus 4.6 has ~$30-40 per
# 5 hours: second reviewer, escalation, prose that ships. Kimi K3 has $20 that ends 2026-10-24: spend it on
# advice and adjudication before then. Quota pools: Opus and Sonnet share one, all Gemini models share one;
# Composer, Kimi and DeepSeek each have their own. Sonnet is unused: it would spend Opus's pool. Composer 2.5 fast misreported tool results and passed
# an impossible task without BLOCKED (research/findings.md §6): only where a test decides, never where
# its words are trusted (no reviews, no research, no advice). Excluded from coding: Codex/GPT models.
ROLE_implement="gemini-3.8-flash-tiered high"                # main worker
ROLE_implement_hard="deepseek/deepseek-flash-max"            # retry after a gate failure: a different family than the first try
ROLE_implement_alt="deepseek/deepseek-flash-max"             # fan-out partner (second family)
ROLE_implement_alt2="cu/composer-2.5-fast"                   # third fan-out candidate; selected only by tests
ROLE_quick="cu/composer-2.5-fast"                            # trivial edits whose exact place is known; the gate decides

ROLE_escalate="antigravity/claude-opus-4-6-thinking"         # after two cheap gate failures, or judged hard up front
ROLE_last_resort="antigravity/claude-opus-4-6-thinking"      # one attempt with the full failure history
ROLE_write="antigravity/claude-opus-4-6-thinking"            # prose that ships: docs, ADR drafts, README
ROLE_draft="gemini-3.8-flash-tiered high"                    # prose drafts, issue text, summaries
ROLE_review="deepseek/deepseek-flash"                        # precise reviewer, different family from the main worker
ROLE_review_alt="antigravity/claude-opus-4-6-thinking"       # second reviewer: strongest available
ROLE_review_gemini="gemini-3.8-flash-tiered high"            # reviewer when the change came from DeepSeek
ROLE_review_kimi="cursor/kimi-k3-high"                       # third view on risky diffs, until 2026-10-24
ROLE_deep_review="antigravity/claude-opus-4-6-thinking"      # thorough: large or risky diffs
ROLE_bughunt="antigravity/gemini-3.1-pro-high"               # read-only bug hunt in a module (slow, large quota)
ROLE_adjudicate="cursor/kimi-k3-high"                        # read-only: settles a disputed finding; Opus after 2026-10-24
ROLE_explore="gemini-3.8-flash-tiered high"                  # read-only research digest (delegate.sh explore)

# Ticket mode (delegate.sh ticket / feature): a stronger model writes the failing tests first, the
# harness locks them, the implementer makes them pass, two reviewers check spec and standards.
ROLE_tests="antigravity/gemini-3.1-pro-high"                 # test writer: strong, large quota, slow
ROLE_review_spec="deepseek/deepseek-flash"                   # does the change do what the ticket and spec say
ROLE_review_std="antigravity/claude-opus-4-6-thinking"       # standards, smells, test quality
TICKET_ESCALATE_ROLE="escalate"                               # after TICKET_ESCALATE_AFTER failed rounds
TICKET_ESCALATE_AFTER=2

# Single-pass advisors for the orchestrator (`delegate.sh ask`), never coding workers.
ROLE_advise="cursor/kimi-k3-high"                            # until 2026-10-24: use it for every plan and contested call
ROLE_advise_alt="antigravity/claude-opus-4-6-thinking"       # second opinion; the advisor after 2026-10-24

# Roles that never keep edits (REVIEW mode).
READ_ONLY_ROLES="review review-alt review-gemini review-kimi deep-review bughunt adjudicate explore review-spec review-std"

# Default reviewers for `delegate.sh review`: two families, neither of them the main worker's.
REVIEW_ROLES="review,review-alt"

# Cheap read-only subagent every worker may hand searches to. Gemini: large quota, fast.
SCOUT_MODEL="gemini-3.8-flash-tiered"
