# agent-box global settings. Sourced by delegate.sh; per-project keys stay in projects/*.env.
# Workflow and evidence: research/workflow.md. Model knobs: research/opencode-customization.md.

# Engine. Podman: ~0.75 GB less RAM on the Windows side once Docker Desktop is closed, but the Lykos
# suite ran 653 s vs Docker's 504 s (one run each, 2026-10-12). An env var overrides this line.
AGENT_BOX_ENGINE="${AGENT_BOX_ENGINE:-podman}"

# Roles: "<OmniRoute model id> [reasoning effort]". Effort is sent as reasoning_effort; OmniRoute drops
# it for antigravity/claude-*, so those roles carry none. Codex/GPT models are excluded: they fail at
# multi-step agent work through this router (2026-10-12).
#
# Quota rule: Sonnet and Opus are never a first attempt and never part of a fan-out.
ROLE_implement="deepseek/deepseek-flash"                     # default implementer
ROLE_implement_hard="deepseek/deepseek-flash-high"           # cross-module work, or retry after a gate failure
ROLE_feature="gemini-3.8-flash-tiered medium"                # second family: parallel attempt, multi-file features
ROLE_feature_hard="gemini-3.8-flash-tiered high"
ROLE_escalate="antigravity/claude-sonnet-4-6"                # after two cheap gate failures, or judged hard up front
ROLE_last_resort="antigravity/claude-opus-4-6-thinking"      # one attempt with the full failure history; tie-breaks
ROLE_write="antigravity/claude-sonnet-4-6"                   # prose that ships: docs, ADR drafts, README
ROLE_draft="gemini-3.8-flash-tiered medium"                  # cheap prose drafts, issue text, summaries
ROLE_review="deepseek/deepseek-flash"                        # fast cross-family reviewer
ROLE_review_alt="gemini-3.8-flash-tiered medium"             # second family reviewer
ROLE_deep_review="antigravity/gemini-3.1-pro-high"           # slow, thorough: large or risky diffs
ROLE_bughunt="antigravity/gemini-3.1-pro-high"               # read-only bug hunt in a module
ROLE_adjudicate="antigravity/claude-opus-4-6-thinking"       # read-only: settles a disputed high-severity finding

# Roles that never keep edits (REVIEW mode).
READ_ONLY_ROLES="review review-alt deep-review bughunt adjudicate"

# Default reviewers for `delegate.sh review`.
REVIEW_ROLES="review,review-alt"

# Cheap read-only subagent every worker may hand searches to, so premium workers spend quota on thinking.
SCOUT_MODEL="deepseek/deepseek-flash"
