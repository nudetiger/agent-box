# agent-box global settings. Sourced by delegate.sh; per-project keys stay in projects/*.env.

# Engine. Podman: ~0.75 GB less RAM on the Windows side once Docker Desktop is closed, but the Lykos
# suite ran 653 s vs Docker's 504 s (one run each, 2026-10-12). An env var overrides this line.
AGENT_BOX_ENGINE="${AGENT_BOX_ENGINE:-podman}"

# Roles -> OmniRoute model ids. `delegate.sh run <repo> <task> --role <name>`.
ROLE_implement="deepseek/deepseek-flash"              # default worker: specified features, bug fixes, tests
ROLE_implement_hard="deepseek/deepseek-flash-high"    # retry of a failed implement, or cross-module work
ROLE_feature="gemini-3.8-flash-tiered"                # multi-file features and refactors; parallel second attempt
ROLE_easy="cx/gpt-5.6-luna-xhigh"                     # mechanical edits: renames, moves, lint/type fixes, boilerplate
ROLE_write="cx/gpt-5.6-terra-medium"                  # prose: docs, ADR drafts, README, issue text
ROLE_review="antigravity/gemini-3.1-pro-high"         # read-only review of a branch before merge
ROLE_bughunt="antigravity/gemini-3.1-pro-high"        # read-only bug hunt in a module

# Roles that never keep edits (REVIEW mode).
READ_ONLY_ROLES="review bughunt"
