# Model prices for `delegate.sh stats` (lib/prices.mjs): USD per 1M tokens.
#   <model id or glob>   <input>  <output>  <cache read>
# The first matching line wins; prices.local.conf (not in git) is read before this file. A model with no
# line is unpriced: stats shows "unpriced", never $0. Subscription pools (antigravity, cursor) have no
# per-token bill; give them the API price you would otherwise pay, to compare roles on one scale.
#
# Fill these in with your provider's prices, for example:
# gemini-3.8-flash*                     0.50   3.00   0.05
# deepseek/*                            0.27   1.10   0.07
# antigravity/claude-opus-4-6*         15.00  75.00   1.50
